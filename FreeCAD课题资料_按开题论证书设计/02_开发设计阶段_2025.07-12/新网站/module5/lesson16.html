  <div class="objectives fade-in"><h3>🎯 学习任务</h3><ul><li>检查STL尺寸、法向和单一壳体</li><li>选择桥面平放方向</li><li>比较0.16/0.20mm层高和15/25%填充</li><li>只在拱肋下方设置必要支撑</li><li>记录时间、耗材和支撑体积</li></ul></div>
